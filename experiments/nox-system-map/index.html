<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>N.O.X. — System Map / Prototype</title>
<style>
:root{--bg:#03040a;--text:#f7f3ff;--muted:#b9aec7;--violet:#b23cff;--cyan:#16c9ff;--pink:#ff4cdd;--amber:#ffb02e}
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;min-height:100vh;color:var(--text);font-family:Arial,sans-serif;background:radial-gradient(circle at 50% 42%,#24103e 0,transparent 24%),radial-gradient(circle at 20% 15%,#15092c 0,transparent 25%),#03040a}.shell{width:min(1500px,100%);margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:28px;align-items:end;margin-bottom:18px}.brand{font-size:clamp(2rem,4vw,4.6rem);font-weight:900;letter-spacing:.18em;text-shadow:0 0 18px #b23cff}.brand small{display:block;font-size:.22em;letter-spacing:.32em;font-weight:400}.intro{max-width:560px;color:var(--muted);line-height:1.5}.map{position:relative;min-height:860px;overflow:hidden;border:1px solid #4b2569;background:radial-gradient(circle at 50% 48%,rgba(171,52,255,.23),transparent 23%),linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px),rgba(2,3,9,.8);background-size:auto,42px 42px,42px 42px;box-shadow:inset 0 0 90px #090015}
.map:before{content:"“ RIEN N'EST FIGÉ. TOUT EST UNE ÉTAPE. ”";position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:.65rem;letter-spacing:.22em;color:#d8c4e9}.core{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);width:230px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,#130b1d 0 40%,#030308 70%);border:2px solid #b23cff;box-shadow:0 0 24px #b23cff,0 0 90px rgba(178,60,255,.55);z-index:3}.core:before,.core:after{content:"";position:absolute;inset:-25px;border:1px solid rgba(178,60,255,.5);border-radius:50%;transform:scaleY(.45) rotate(25deg);box-shadow:0 0 18px #6e23ff}.core:after{inset:-50px;transform:scaleY(.7) rotate(-34deg);opacity:.45}.core b{font-size:2.1rem;letter-spacing:.18em}.core span{display:block;margin-top:7px;font-size:.66rem;color:#d0bddc;letter-spacing:.12em}.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.links line{stroke-width:3;opacity:.55;filter:drop-shadow(0 0 7px currentColor)}
.card{position:absolute;width:36%;height:245px;border:0;padding:0;background:none;color:inherit;perspective:1400px;cursor:pointer;z-index:4}.card[data-axis=perception]{left:2%;top:14%;--accent:var(--cyan)}.card[data-axis=cognition]{right:2%;top:14%;--accent:var(--pink)}.card[data-axis=presence]{left:2%;bottom:15%;--accent:var(--pink)}.card[data-axis=action]{right:2%;bottom:15%;--accent:var(--amber)}.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .75s cubic-bezier(.2,.75,.2,1)}.card.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--accent);clip-path:polygon(4% 0,96% 0,100% 10%,100% 90%,96% 100%,4% 100%,0 90%,0 10%);background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 12%,#070712),rgba(4,5,12,.94) 38%,rgba(9,5,16,.97));box-shadow:inset 0 0 28px color-mix(in srgb,var(--accent) 10%,transparent);text-align:left}.front{display:grid;place-items:center}.front .glyph{font-size:4rem;line-height:1;width:108px;height:108px;display:grid;place-items:center;border:2px solid var(--accent);border-radius:50%;color:var(--accent);text-shadow:0 0 18px var(--accent);box-shadow:0 0 22px color-mix(in srgb,var(--accent) 55%,transparent),inset 0 0 22px color-mix(in srgb,var(--accent) 25%,transparent)}.front strong{position:absolute;bottom:28px;font-size:1rem;letter-spacing:.25em;color:var(--accent)}.front small{position:absolute;top:20px;right:25px;font-size:.55rem;letter-spacing:.16em;color:#978aa3}.back{transform:rotateY(180deg);padding:22px 26px;overflow:hidden}.back h2{margin:0;color:var(--accent);font-size:1.35rem;letter-spacing:.07em;text-shadow:0 0 12px color-mix(in srgb,var(--accent) 65%,transparent)}.back h2 span{display:block;font-size:.65em;letter-spacing:.22em;margin-top:3px}.question{margin:12px 0 10px;font-size:.78rem;line-height:1.35}.features{list-style:none;padding:0;margin:0;display:grid;gap:5px}.features li{font-size:.7rem;color:#d7cedd}.features li:before{content:"●";color:var(--dot,var(--accent));margin-right:8px;text-shadow:0 0 8px currentColor}.features li.dev{--dot:#ffb02e}.features li.future{--dot:#9c9aaa}.study{position:absolute;right:25px;bottom:18px;color:var(--accent);font-size:.63rem;text-decoration:none;letter-spacing:.08em}.study:hover{text-decoration:underline}.card:hover .face,.card:focus-visible .face{filter:brightness(1.15);box-shadow:inset 0 0 35px color-mix(in srgb,var(--accent) 15%,transparent),0 0 18px color-mix(in srgb,var(--accent) 35%,transparent)}.card:focus-visible{outline:2px solid white;outline-offset:4px}.action-note{position:absolute;right:24px;bottom:18px;border:1px solid var(--amber);padding:6px 9px;font-size:.55rem;color:#ffd58a}.loop{position:absolute;left:5%;right:5%;bottom:2.5%;height:85px;border:1px solid #653487;background:rgba(5,4,12,.8);display:flex;align-items:center;justify-content:center;gap:18px;padding:14px;font-size:.7rem;letter-spacing:.08em}.loop b{color:#e262ff}.arrow{color:#a946ff;font-size:1.3rem}.hint{position:absolute;left:50%;top:8%;transform:translateX(-50%);font-size:.58rem;letter-spacing:.18em;color:#8d789d}
@media(max-width:900px){.shell{padding:10px}.top{display:block}.intro{margin-top:12px}.map{min-height:auto;padding:82px 10px 125px;display:flex;flex-direction:column;gap:14px}.links{display:none}.core{position:relative;left:auto;top:auto;transform:none;margin:18px auto 34px;width:170px;display:grid;order:-1}.core b{font-size:1.55rem}.card{position:relative!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;width:100%;height:235px;display:block;flex:0 0 235px}.inner{display:block;width:100%;height:100%}.face{display:block;width:100%;height:100%}.front .glyph{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);display:grid}.front strong{left:0;right:0;text-align:center}.back{padding:18px 22px}.loop{height:auto;flex-wrap:wrap}.hint{top:55px}.map:before{white-space:nowrap;font-size:.48rem}}
@media(prefers-reduced-motion:reduce){.inner{transition:none}.card.flipped .inner{transform:none}.card.flipped .front{visibility:hidden}.card.flipped .back{transform:none}}
</style>
</head>
<body><main class="shell"><header class="top"><div class="brand">N.O.X.<small>AGENT IA EXPÉRIMENTAL</small></div><p class="intro">Observer, apprendre, agir. Quatre axes répondent à quatre questions distinctes et composent un même système.</p></header><section class="map" aria-label="Architecture interactive de N.O.X."><div class="hint">CLIQUER SUR UNE CARTE POUR LA RETOURNER</div>
<svg class="links" viewBox="0 0 1000 860" preserveAspectRatio="none" aria-hidden="true"><line x1="500" y1="420" x2="220" y2="230" style="stroke:#16c9ff"/><line x1="500" y1="420" x2="780" y2="230" style="stroke:#ff4cdd"/><line x1="500" y1="420" x2="220" y2="610" style="stroke:#ff4cdd"/><line x1="500" y1="420" x2="780" y2="610" style="stroke:#ffb02e"/></svg>
<div class="core"><div><b>N.O.X.</b><span>NOYAU CENTRAL<br>CONTEXTE · MÉMOIRE · DÉCISION</span></div></div>
<button class="card" data-axis="perception" aria-pressed="false"><span class="inner"><span class="face front"><small>01 / ACTIF</small><span class="glyph">◉</span><strong>PERCEPTION</strong></span><span class="face back"><h2>KIROSHI<span>PERCEPTION</span></h2><p class="question">Comment N.O.X. comprend-il ce qui se passe autour de lui ?</p><ul class="features"><li>Capture d'informations jeu / écran</li><li class="dev">Détection d'états et d'événements</li><li class="dev">Conversion en événements sémantiques</li><li class="dev">Filtrage et priorisation</li><li class="future">Contexte temps réel</li></ul><a class="study" href="../../projects/kiroshi/index.html">ÉTUDE DE CAS →</a></span></span></button>
<button class="card" data-axis="cognition" aria-pressed="false"><span class="inner"><span class="face front"><small>02 / ACTIF</small><span class="glyph">♙</span><strong>COGNITION</strong></span><span class="face back"><h2>N.O.X. CORE<span>COGNITION</span></h2><p class="question">Comment N.O.X. réfléchit-il et décide-t-il d'intervenir ?</p><ul class="features"><li>Mémoire et historique</li><li class="dev">État interne et préférences</li><li class="dev">Routage et sélection de réponse</li><li class="dev">Arbitrage : répondre / se taire</li><li class="future">Cohérence et continuité</li></ul><a class="study" href="../../projects/nox/index.html">ÉTUDE DE CAS →</a></span></span></button>
<button class="card" data-axis="presence" aria-pressed="false"><span class="inner"><span class="face front"><small>03 / PROTOTYPE</small><span class="glyph">◇</span><strong>PRÉSENCE</strong></span><span class="face back"><h2>N.O.X. DESKTOP<span>PRÉSENCE</span></h2><p class="question">Comment donner une présence perceptible à N.O.X. dans mon environnement ?</p><ul class="features"><li>Avatar et représentation visuelle</li><li class="dev">Animations et états expressifs</li><li class="dev">Overlay desktop transparent</li><li class="dev">Intégration stream / OBS</li><li class="future">Audio réactif</li></ul><a class="study" href="../../projects/nox-desktop/index.html">ÉTUDE DE CAS →</a></span></span></button>
<button class="card" data-axis="action" aria-pressed="false"><span class="inner"><span class="face front"><small>04 / CONCEPT</small><span class="glyph">⚙</span><strong>ACTION</strong></span><span class="face back"><h2>ACTION<span>INTERVENTION · OUTILS · SÉCURITÉ</span></h2><p class="question">Comment N.O.X. peut-il agir de manière contrôlée sur son environnement ?</p><ul class="features"><li class="future">Outils locaux autorisés</li><li class="future">Interactions avec des logiciels</li><li class="future">Cybersécurité défensive</li><li class="future">Validation utilisateur</li><li class="future">Autonomie bornée et permissions</li></ul><span class="action-note">CONCEPT · PLUS TARD</span></span></span></button>
<div class="loop"><b>LA BOUCLE</b><span>PERCEVOIR</span><span class="arrow">→</span><span>COMPRENDRE</span><span class="arrow">→</span><span>DÉCIDER</span><span class="arrow">→</span><span>AGIR</span><span class="arrow">→</span><span>OBSERVER LES CONSÉQUENCES</span></div>
</section></main><script>document.querySelectorAll(".card").forEach(c=>c.addEventListener("click",e=>{if(e.target.closest("a"))return;c.classList.toggle("flipped");c.setAttribute("aria-pressed",c.classList.contains("flipped"))}));</script></body></html>
